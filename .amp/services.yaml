services:
  api:
    command: mkdir -p runtime/uploads && DATABASE_URL="$PWD/runtime/newcredit.sqlite" NEWCREDIT_UPLOAD_DIR="$PWD/runtime/uploads" HOST=127.0.0.1 pnpm --filter @newcredit/api dev
    port: 3001
    health: /health
  web:
    command: pnpm --filter @newcredit/web exec vite --host 0.0.0.0 --port "$PORT"
    health: /
    agent: control
    portal:
      title: NewCredit demo
      description: Run the Scenario A, B, C, and H personal-loan demonstrations with synthetic data.
